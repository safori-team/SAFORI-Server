plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.springdoc.openapi-gradle-plugin' version '1.8.0'
    id 'jacoco'
}

group = 'com.safori'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Web
    implementation 'org.springframework.boot:spring-boot-starter-web'
    // Spring JPA
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    // Spring Validation (@Valid / ConstraintViolation 예외 처리)
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    // Spring Actuator (기동/헬스 확인)
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // Spring Security Crypto (PasswordEncoder / BCrypt)
    implementation 'org.springframework.security:spring-security-crypto'
    // Spring Security Core (UserDetails / Authentication) — 인증 필터(SecurityConfig)는 #49에서 추가
    implementation 'org.springframework.security:spring-security-core'
    // Spring Security Web (FilterChainProxy) — springdoc security 연동 클래스 로딩용. SecurityFilterChain은 #49
    implementation 'org.springframework.security:spring-security-web'

    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

    // Swagger / OpenAPI
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.0.2'

    // MySQL
    runtimeOnly 'com.mysql:mysql-connector-j'

    // H2 (test)
    testImplementation 'com.h2database:h2'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

openApi {
    apiDocsUrl = "http://localhost:8080/v3/api-docs"
    outputDir = layout.buildDirectory.dir("docs")
    outputFileName = "openapi.json"
    waitTimeInSeconds = 60
}

jacoco {
    toolVersion = "0.8.12"
}

// 커버리지 측정 대상 = 비즈니스 로직 레이어만.
// DTO, config, advice(thin), 예외/핸들러, MapStruct 생성코드 등은 제외.
def jacocoExcludes = [
        'com/safori/SaforiServerApplication*',
        '**/config/**',
        '**/*Config*',
        '**/dto/**',
        '**/*Request*',
        '**/*Response*',
        '**/*Dto*',
        '**/advice/**',
        '**/controller/**',
        '**/exception/**',
        '**/*Handler*',
        '**/*ErrorStatus*',
        '**/*SuccessStatus*',
        '**/*Exception*',
        '**/*MapperImpl*',
]

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
        csv.required = true
    }
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: jacocoExcludes)
        }))
    }
}

jacocoTestCoverageVerification {
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: jacocoExcludes)
        }))
    }
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                // 베이스라인 측정 후 단계적 상향. 최종 목표 0.70.
                minimum = 0.00
            }
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
