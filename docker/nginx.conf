# 앱 앞단 리버스 프록시 — 우리가 쓰는 API 경로만 통과시킨다.
#
# 실제 배포본은 env-repo의 `<profile>.nginx.conf`이고 이 파일은 레퍼런스다
# (otel-collector-config.yaml과 같은 방식). 프로파일별로 다른 부분은 아래 "운영에서 막을 것"
# 주석을 참고해 env-repo 쪽에서 조정한다.
#
# TLS는 ALB에서 끝난다. 여기는 평문 HTTP만 받는다.
# ALB 헬스체크는 이 프록시를 거치지 않고 앱의 관리 포트(9082)로 직접 간다.

# ALB가 붙인 X-Forwarded-Proto를 그대로 넘기고, 없으면 현재 스킴으로 채운다.
# (앱이 server.forward-headers-strategy=framework 로 이 헤더들을 읽는다)
map $http_x_forwarded_proto $forwarded_proto {
    ""      $scheme;
    default $http_x_forwarded_proto;
}

server {
    listen 80;
    server_name _;

    # 도커 내장 DNS. 배포마다 앱 컨테이너가 재생성되며 IP가 바뀌는데, 업스트림을 변수로 두면
    # nginx가 매번 다시 resolve 한다. 상수로 두면 옛 IP를 붙들고 502를 낸다.
    resolver 127.0.0.11 valid=10s ipv6=off;
    # 앱 컨테이너의 네트워크 별칭(deploy.yml의 --network-alias). 컨테이너 이름과 무관하게 고정.
    set $app "safori-app";

    # 마음일기 오디오 업로드. nginx 기본값 1m이면 여기서 413으로 막힌다.
    # (앱의 spring.servlet.multipart.max-request-size 와 맞춘다)
    client_max_body_size 25m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-Host  $host;

    proxy_connect_timeout 5s;
    proxy_send_timeout    90s;
    # 챗봇 응답 생성이 음성 기준 최대 20초대. 여유를 두되 무한정 잡지는 않는다.
    proxy_read_timeout    90s;

    # ── 통과 대상 ────────────────────────────────────────────────────────────
    # /v1/api/auth, /v1/api/users, /v1/api/chatbot, /v1/api/dev 전부 이 접두어 아래에 있다.
    location /v1/api/ {
        proxy_pass http://$app:8080;
    }

    # 운영에서 막을 것: 개발용 마음일기 시딩 API.
    # prod.nginx.conf 에서는 아래 주석을 풀어 /v1/api/ 블록보다 먼저 매칭시킨다.
    # location /v1/api/dev/ { return 404; }

    # ── Swagger UI ───────────────────────────────────────────────────────────
    # 팀 수동 테스트용으로 연다. UI 셸(/swagger-ui.html)은 /swagger-ui/index.html 로
    # 리다이렉트되고, 그 페이지가 /v3/api-docs 를 다시 호출하므로 셋 다 열려 있어야 뜬다.
    #
    # 주의: 전체 API 목록·스키마가 공개된다. 운영에서는 prod.nginx.conf 에서 이 세 블록을
    # 지우거나(문서는 S3 정적 사이트로 따로 배포됨), 아래 "접근 제한" 주석을 적용한다.
    location = /swagger-ui.html {
        proxy_pass http://$app:8080;
    }

    location /swagger-ui/ {
        proxy_pass http://$app:8080;
    }

    location /v3/api-docs {
        # 접근 제한이 필요하면 아래를 켠다. ALB 뒤라 $remote_addr 는 ALB IP이므로
        # real_ip 모듈로 원 클라이언트 IP를 복원한 뒤에 판단해야 한다.
        #   set_real_ip_from <VPC CIDR>;
        #   real_ip_header X-Forwarded-For;
        #   real_ip_recursive on;
        #   allow <사무실 공인 IP>; deny all;
        proxy_pass http://$app:8080;
    }

    # 배포 스크립트가 프록시 경유 상태를 확인하는 엔드포인트.
    # ALB 헬스체크는 9082를 직접 보므로 여기로 오지 않는다.
    location = /healthz {
        access_log off;
        proxy_pass http://$app:9082/actuator/health;
    }

    # 액추에이터를 포함한 나머지는 전부 차단.
    location / {
        return 404;
    }
}
