# alpha(개발) 서버 프로파일
logging:
  level:
    root: INFO
    com.safori: INFO

# alpha는 Sentry Logs 켜서 로그도 Sentry로 전송(트레이스와 연동). DSN 있어야 실제 전송됨.
sentry:
  logs:
    enabled: ${SENTRY_LOGS_ENABLED:true}
  logging:
    minimum-level: ${SENTRY_LOG_MIN_LEVEL:info}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
