server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: safori-server

  # .env 파일이 있으면 로드 (없어도 기동)
  config:
    import: optional:file:.env[.properties]

  # 프로파일 미지정 시 local 로 기동
  profiles:
    default: local

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    show-sql: ${JPA_SHOW_SQL:false}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  api-docs:
    path: /v3/api-docs

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:9082}
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
