server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

spring:
  application:
    name: safori-server

  # 개발용 마음일기 시딩(오디오 멀티파트 업로드)용. 기본 1MB로는 오디오가 막힌다.
  servlet:
    multipart:
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:20MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:25MB}

  # .env 파일이 있으면 로드 (없어도 기동)
  config:
    import: optional:file:.env[.properties]

  # 프로파일 미지정 시 local 로 기동
  profiles:
    default: local

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    show-sql: ${JPA_SHOW_SQL:false}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  # @Scheduled 공용 스케줄러 스레드 풀. 기본값 1이라 한 태스크가 길어지면 나머지가 밀린다.
  # 현재 태스크 4개(감정분석 타임아웃 스윕·마음일기 제안 스캔·미확정 응답 마감·주간 리포트 푸시)
  # 중 타임아웃 스윕은 소분류 분석의 유일한 회수 경로라 밀리면 일기가 분석 중으로 남는다.
  task:
    scheduling:
      pool:
        size: ${SCHEDULING_POOL_SIZE:4}

  # AWS S3 (음성 파일 업로드 Presigned URL)
  cloud:
    aws:
      credentials:
        access-key: ${AWS_ACCESS_KEY:}
        secret-key: ${AWS_SECRET_KEY:}
      region:
        static: ${AWS_REGION:ap-northeast-2}
      s3:
        bucket: ${AWS_S3_BUCKET:}

# JWT 서명 시크릿 (Base64 인코딩된 HMAC-SHA256 키)
token:
  secret-user: ${TOKEN_SECRET_USER}

# Gemini (음성 분석 어댑터). api-key 비우면 분석 비활성화(서버는 정상 기동)
gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-2.5-flash}

  # CBT 상담 응답 생성에 적용할 안전 필터 임계값.
  # https://ai.google.dev/gemini-api/docs/safety-settings
  #
  # 차단되면 상담 응답 대신 위기 안내가 나가고 세션이 종료된다(CrisisTrigger.SAFETY_BLOCKED).
  # 노인 상담은 사별·질병·죽음 이야기가 정상적으로 오가므로 LOW까지 조이면 멀쩡한 상담이 끊긴다.
  # 자·타해 신호가 뚜렷할 때만 걸리도록 잡은 값이고, 운영에서 오탐/미탐을 보며 조절한다.
  # 값: BLOCK_NONE | BLOCK_ONLY_HIGH | BLOCK_MEDIUM_AND_ABOVE | BLOCK_LOW_AND_ABOVE | OFF
  safety:
    enabled: ${GEMINI_SAFETY_ENABLED:true}
    # 자·타해·자살 암시가 걸리는 핵심 카테고리
    dangerous-content: ${GEMINI_SAFETY_DANGEROUS_CONTENT:BLOCK_MEDIUM_AND_ABOVE}
    harassment: ${GEMINI_SAFETY_HARASSMENT:BLOCK_MEDIUM_AND_ABOVE}
    hate-speech: ${GEMINI_SAFETY_HATE_SPEECH:BLOCK_ONLY_HIGH}
    sexually-explicit: ${GEMINI_SAFETY_SEXUALLY_EXPLICIT:BLOCK_ONLY_HIGH}

# 마음일기 → 도란이 선제 대화 세션 생성 정책.
# PM 정책 변경은 대부분 아래 값만 바꿔 대응한다(배포 불필요, env override 가능).
# 규칙의 형태 자체가 바뀌면 SessionTriggerPolicy 구현체를 추가하고 policy 값을 바꾼다.
safori:
  # 소분류 감정 분석 비동기 파이프라인(SQS).
  # 큐 URL을 비우면 파이프라인이 비활성화되고 Gemini 소분류로 즉시 분석을 마감한다.
  # 운영 큐를 로컬에서 켜면 응답 메시지를 가로채므로 기본값은 비워 둔다.
  emotion-analysis:
    request-queue-url: ${EMOTION_ANALYSIS_REQUEST_QUEUE_URL:}
    response-queue-url: ${EMOTION_ANALYSIS_RESPONSE_QUEUE_URL:}
    # Long Polling 대기(초, 상한 20) / 1회 수신 최대 건수(상한 10)
    poll-wait-seconds: ${EMOTION_ANALYSIS_POLL_WAIT_SECONDS:20}
    poll-max-messages: ${EMOTION_ANALYSIS_POLL_MAX_MESSAGES:10}
    # 이 시간이 지나도 응답이 없으면 Gemini 소분류로 마감한다.
    # 분석 Lambda 5xx·타임아웃은 응답 큐에 아무 것도 넣지 않아 이 값이 유일한 회수 경로다.
    pending-timeout: ${EMOTION_ANALYSIS_PENDING_TIMEOUT:PT10M}
    sweep-interval: ${EMOTION_ANALYSIS_SWEEP_INTERVAL:PT2M}

  chatbot:
    # CBT 상담 대화 길이 제한.
    conversation:
      # 세션당 허용 사용자 발화 횟수. 마지막 발화의 응답이 마무리 멘트가 되고 세션이 닫힌다.
      # (마음일기 세션 기준: 도란이 질문 → 사용자 응답 이 횟수만큼 오간 뒤 종료)
      max-user-turns: ${CHAT_MAX_USER_TURNS:4}

    # 위기 가드레일. 자·타해 의도가 드러나면 상담을 즉시 끝내고 전문기관 안내로 갈아탄다
    # (프론트는 sessionClosed=true + crisisDetected=true를 받는다).
    #
    # Gemini 안전 필터(gemini.safety)는 두 번째 그물일 뿐이다 — "죽고 싶다"는 위험 콘텐츠
    # '생성'이 아니라 그대로 통과하는 경우가 많아, 아래 키워드가 LLM 호출 전에 먼저 받는다.
    guardrail:
      enabled: ${CHAT_GUARDRAIL_ENABLED:true}
      # 비워 두면 CrisisGuardrailProperties의 기본 목록을 쓴다. 공백을 지운 발화에 부분 매칭한다.
      # "힘들어 죽겠다" 같은 관용구는 일부러 넣지 않았다 — 넣으면 정상 상담이 계속 끊긴다.
      # high-risk-keywords: ${CHAT_GUARDRAIL_KEYWORDS:}
    session-trigger:
      # ALWAYS: 일기 1건마다 세션 1개 (구 정책) / CONSECUTIVE_NEGATIVE: N일 연속 부정 감정일 때만
      policy: ${SESSION_TRIGGER_POLICY:CONSECUTIVE_NEGATIVE}
      # 스캔 주기
      interval: ${SESSION_TRIGGER_INTERVAL:PT10M}
      # 이 시간 안에 분석 완료된 일기만 후보. 넓히면 장애 복구 범위가 늘지만,
      # 정책 변경 직후 과거 세션이 한꺼번에 생성될 수 있다.
      scan-lookback: ${SESSION_TRIGGER_SCAN_LOOKBACK:PT48H}
      # 1회 실행당 최대 처리 건수 (LLM 호출 폭주 방지)
      scan-batch-size: ${SESSION_TRIGGER_BATCH_SIZE:50}
      # 세션 생성에 필요한 연속 부정 감정 일수
      consecutive-days: ${SESSION_TRIGGER_CONSECUTIVE_DAYS:3}
      # "부정" 대분류 정의. 대분류가 바뀌면 이 값만 수정한다.
      negative-emotions: ${SESSION_TRIGGER_NEGATIVE_EMOTIONS:SAD,ANGRY,ANXIETY}
      # 프롬프트에 넣을 일기 범위. TRIGGER_ONLY | FIXED_DAYS | STREAK
      context-window: ${SESSION_TRIGGER_CONTEXT_WINDOW:STREAK}
      # FIXED_DAYS 전용
      context-window-days: ${SESSION_TRIGGER_CONTEXT_WINDOW_DAYS:3}
      # 컨텍스트 일기 개수 상한 (프롬프트 토큰 비용 상한)
      max-context-diaries: ${SESSION_TRIGGER_MAX_CONTEXT_DIARIES:5}

# OpenAI (주간 감정 리포트). api-key 비우면 리포트 생성 시 예외(서버는 정상 기동)
openai:
  api-key: ${OPENAI_API_KEY:}
  model: ${OPENAI_MODEL:gpt-4o-mini}

# Firebase (FCM 푸시 알림). credentials-base64 비우면 푸시 비활성화(서버는 정상 기동)
firebase:
  credentials-base64: ${FIREBASE_CREDENTIALS_BASE64:}

# Sentry 에러. dsn 비면 비활성. 트레이스는 OTEL_* 환경변수(.env.example) 참고.
sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:local}
  send-default-pii: false
  # 구조화 로그(Sentry Logs)로 애플리케이션 로그 전송. 스타터가 SentryAppender 자동 등록.
  logs:
    enabled: ${SENTRY_LOGS_ENABLED:false}
  logging:
    # 이 레벨 이상 로그를 Sentry Logs로 전송(logs.enabled=true일 때). 기본 INFO.
    minimum-level: ${SENTRY_LOG_MIN_LEVEL:info}
    # 이 레벨 이상 로그를 Issue(이벤트)로 전송. 기본 ERROR — log.error가 스택트레이스와 함께 올라감.
    minimum-event-level: ${SENTRY_LOG_EVENT_LEVEL:error}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  api-docs:
    path: /v3/api-docs

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:9082}
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
