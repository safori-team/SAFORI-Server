server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: safori-server

  # .env 파일이 있으면 로드 (없어도 기동)
  config:
    import: optional:file:.env[.properties]

  # 프로파일 미지정 시 local 로 기동
  profiles:
    default: local

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    show-sql: ${JPA_SHOW_SQL:false}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  # AWS S3 (음성 파일 업로드 Presigned URL)
  cloud:
    aws:
      credentials:
        access-key: ${AWS_ACCESS_KEY:}
        secret-key: ${AWS_SECRET_KEY:}
      region:
        static: ${AWS_REGION:ap-northeast-2}
      s3:
        bucket: ${AWS_S3_BUCKET:}

# JWT 서명 시크릿 (Base64 인코딩된 HMAC-SHA256 키)
token:
  secret-user: ${TOKEN_SECRET_USER}

# Gemini (음성 분석 어댑터). api-key 비우면 분석 비활성화(서버는 정상 기동)
gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-2.5-flash}

# OpenAI (주간 감정 리포트). api-key 비우면 리포트 생성 시 예외(서버는 정상 기동)
openai:
  api-key: ${OPENAI_API_KEY:}
  model: ${OPENAI_MODEL:gpt-4o-mini}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  api-docs:
    path: /v3/api-docs

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:9082}
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
