# 테스트 전용 프로파일 — 인메모리 H2 사용
spring:
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:h2:mem:safori;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
    show-sql: true
