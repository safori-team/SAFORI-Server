name: test-and-deploy

# 브랜치 → 환경/프로파일 매핑
#   main    → environment: prod,  SPRING_PROFILES_ACTIVE=prod
#   develop → environment: alpha, SPRING_PROFILES_ACTIVE=alpha
# 환경별 ECR/SSM/포트/컨테이너 값은 GitHub Environments(prod/alpha)의
# vars/secrets 로 분리해서 주입한다. (필요 키 목록: docs/CICD-SETUP.md)
#
# 배포는 SSM 으로 tag:Name 이 일치하는 EC2 에서 .github/scripts/remote-deploy.sh 를 실행한다.
# 인스턴스가 여러 대면 한 대씩 순차로 배포하고, 한 대라도 실패하면 거기서 멈춘다.

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: ssm-deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  setup:
    runs-on: ubuntu-22.04
    outputs:
      environment: ${{ steps.map.outputs.environment }}
      profile: ${{ steps.map.outputs.profile }}
    steps:
      - name: Map branch to environment/profile
        id: map
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "environment=prod"  >> "$GITHUB_OUTPUT"
            echo "profile=prod"      >> "$GITHUB_OUTPUT"
          else
            echo "environment=alpha" >> "$GITHUB_OUTPUT"
            echo "profile=alpha"     >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: setup
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: ./gradlew test

  push-image:
    needs: [setup, test]
    runs-on: ubuntu-22.04
    environment: ${{ needs.setup.outputs.environment }}
    outputs:
      image_uri: ${{ steps.image-uri.outputs.image_uri }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      # ECR lifecycle 이 환경 접두어별로 최근 5개를 남긴다 (infra/shared/ecr.tf)
      IMAGE_TAG: ${{ needs.setup.outputs.profile }}-${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: github-actions-ecr-push
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image to Amazon ECR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export image URI
        id: image-uri
        run: echo "image_uri=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}" >> "$GITHUB_OUTPUT"

  deploy-via-ssm:
    needs: [setup, push-image]
    runs-on: ubuntu-22.04
    environment: ${{ needs.setup.outputs.environment }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      SSM_TARGET_KEY: ${{ vars.SSM_TARGET_KEY }}
      SSM_TARGET_VALUE: ${{ vars.SSM_TARGET_VALUE }}
      APP_DIR: ${{ vars.APP_DIR }}
      CONTAINER_NAME: ${{ vars.CONTAINER_NAME }}
      APP_PORT: ${{ vars.APP_PORT }}
      MGMT_PORT: ${{ vars.MGMT_PORT }}
      DOCKER_NETWORK: ${{ vars.DOCKER_NETWORK }}
      SPRING_PROFILE: ${{ needs.setup.outputs.profile }}
      IMAGE_URI: ${{ needs.push-image.outputs.image_uri }}

    steps:
      - name: Checkout (배포 스크립트)
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: github-actions-ssm-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Send deploy command
        id: send
        run: |
          # 스크립트는 base64 로 싣고, 값은 셸 인용(@sh)해서 export 한다.
          jq -n \
            --arg script "$(base64 -w0 .github/scripts/remote-deploy.sh)" \
            --arg imageUri "$IMAGE_URI" \
            --arg awsRegion "$AWS_REGION" \
            --arg appDir "$APP_DIR" \
            --arg containerName "$CONTAINER_NAME" \
            --arg appPort "$APP_PORT" \
            --arg mgmtPort "$MGMT_PORT" \
            --arg network "$DOCKER_NETWORK" \
            --arg profile "$SPRING_PROFILE" \
            '{
              commands: [
                "set -euo pipefail",
                "echo \($script) | base64 -d > /tmp/safori-remote-deploy.sh",
                "export IMAGE_URI=\($imageUri | @sh) AWS_REGION=\($awsRegion | @sh) APP_DIR=\($appDir | @sh) CONTAINER_NAME=\($containerName | @sh)",
                "export APP_PORT=\($appPort | @sh) MGMT_PORT=\($mgmtPort | @sh) DOCKER_NETWORK=\($network | @sh) SPRING_PROFILE=\($profile | @sh)",
                "bash /tmp/safori-remote-deploy.sh"
              ]
            }' > /tmp/ssm-parameters.json

          COMMAND_ID=$(aws ssm send-command \
            --targets "Key=${SSM_TARGET_KEY},Values=${SSM_TARGET_VALUE}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy ${GITHUB_REPOSITORY}@${GITHUB_SHA} (${SPRING_PROFILE})" \
            --parameters file:///tmp/ssm-parameters.json \
            --max-concurrency 1 \
            --max-errors 0 \
            --timeout-seconds 600 \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM command id: ${COMMAND_ID}"
          echo "command_id=${COMMAND_ID}" >> "$GITHUB_OUTPUT"

      - name: Wait for deployment
        env:
          COMMAND_ID: ${{ steps.send.outputs.command_id }}
        run: |
          # 명령 전체 상태로 판정한다 (인스턴스가 여러 대면 순차로 진행된다).
          STATUS=""
          for _ in $(seq 1 180); do
            STATUS=$(aws ssm list-commands --command-id "$COMMAND_ID" \
              --query 'Commands[0].Status' --output text)
            case "$STATUS" in
              Pending|InProgress|Cancelling) sleep 5 ;;
              *) break ;;
            esac
          done

          TARGETS=$(aws ssm list-commands --command-id "$COMMAND_ID" \
            --query 'Commands[0].TargetCount' --output text)

          # 인스턴스별 출력
          for ID in $(aws ssm list-command-invocations --command-id "$COMMAND_ID" \
                        --query 'CommandInvocations[].InstanceId' --output text); do
            echo "::group::${ID}"
            aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$ID" \
              --query '[Status, StandardOutputContent, StandardErrorContent]' --output text || true
            echo "::endgroup::"
          done

          if [ "$TARGETS" = "0" ]; then
            echo "배포 대상 인스턴스가 없다: ${SSM_TARGET_KEY}=${SSM_TARGET_VALUE} (인스턴스가 정지 상태인지, SSM 에 등록됐는지 확인)"
            exit 1
          fi

          if [ "$STATUS" != "Success" ]; then
            echo "SSM deployment finished with status: ${STATUS}"
            exit 1
          fi
